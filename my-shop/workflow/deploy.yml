name: Deploy static content to Pages

on:
  push:
    branches: ['main'] # або 'master', залежно від назви вашої основної гілки

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './my-shop/package-lock.json' # вкажіть шлях до вашого package-lock.json
      - name: Install dependencies
        run: cd my-shop && npm ci
      - name: Build
        run: cd my-shop && npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './my-shop/dist' # Vite за замовчуванням збирає файли у папку dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
